<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#c2410c"/>
            <stop offset="100%" stop-color="#7c2d12"/>
        </linearGradient>
        <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#grid)"/>

    <!-- Eyebrow -->
    <text x="80" y="200" font-family="Inter, 'Google Sans', sans-serif" font-size="28" font-weight="500" fill="rgba(255,255,255,0.8)" letter-spacing="3" text-transform="uppercase">PORTFÓLIO · ENGENHARIA DE DADOS</text>

    <!-- Title -->
    <text x="80" y="310" font-family="Inter, 'Google Sans', sans-serif" font-size="104" font-weight="700" fill="#ffffff" letter-spacing="-2">Filipe Rodrigues</text>

    <!-- Tagline -->
    <text x="80" y="380" font-family="Inter, 'Google Sans', sans-serif" font-size="36" font-weight="500" fill="rgba(255,255,255,0.92)">Senior Data Engineer · Solution Architect · Tech Lead</text>

    <!-- Subtagline -->
    <text x="80" y="445" font-family="Inter, 'Google Sans', sans-serif" font-size="26" font-weight="400" fill="rgba(255,255,255,0.75)">22+ anos · 40 TB/dia · 3 empresas · 20 produtos em produção</text>

    <!-- Marca FR canto inferior direito -->
    <g transform="translate(1020, 470)">
        <rect width="120" height="120" rx="24" fill="#ffffff"/>
        <text x="60" y="84" font-family="Inter, 'Google Sans', sans-serif" font-size="60" font-weight="700" fill="#c2410c" text-anchor="middle">FR</text>
    </g>

    <!-- Domínio canto inferior esquerdo -->
    <text x="80" y="555" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="500" fill="rgba(255,255,255,0.6)" letter-spacing="1">rodrigues.haus</text>
</svg>
