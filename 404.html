<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#c2410c" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23c2410c%22/><text x=%2250%22 y=%2266%22 font-size=%2256%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22600%22>FR</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">

</head>
<body>
    <a class="skip-link" href="#main" data-i18n="a11y.skip">Pular para o conteúdo</a>

    <header class="topbar">
        <div class="container topbar-inner">
            <a href="index.html" class="brand" data-i18n-attr="aria-label:a11y.brand;title:brand.tooltip" aria-label="Filipe Rodrigues — início" title="Filipe Rodrigues (IPA: /fi.ˈli.pɘ rʊ.ˈdri.ɡəʒ/)">
                <span class="brand-mark">FR</span>
                <span class="brand-name">Filipe Rodrigues</span>
            </a>
            <div class="header-controls">
                <button id="lang-toggle" class="lang-toggle" type="button" data-i18n-attr="aria-label:a11y.lang;title:a11y.lang" aria-label="Alternar idioma" title="Alternar idioma">
                    <span class="lang-opt is-active" data-lang-option="pt" aria-hidden="true">PT</span>
                    <span class="lang-sep" aria-hidden="true">/</span>
                    <span class="lang-opt" data-lang-option="en" aria-hidden="true">EN</span>
                </button>
                <button id="theme-toggle" class="theme-toggle" type="button" data-i18n-attr="aria-label:a11y.theme;title:a11y.theme" aria-label="Alternar tema" title="Alternar tema claro/escuro">
                    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.5" y1="4.5" x2="6.5" y2="6.5"/><line x1="17.5" y1="17.5" x2="19.5" y2="19.5"/><line x1="4.5" y1="19.5" x2="6.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="19.5" y2="4.5"/></g></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main id="main">
        <div class="container err-wrap">
            <p class="eyebrow" data-i18n="err.eyebrow">DAG site_router · execução falhou</p>
            <div class="err-code" aria-hidden="true">404</div>
            <h1 data-i18n="err.title">Esta rota não retornou nenhuma linha.</h1>
            <pre class="err-log" id="err-log" aria-live="polite"></pre>
            <div class="err-actions">
                <a class="btn btn-primary" href="index.html" data-i18n="err.cta_home">← Voltar ao DAG principal</a>
                <a class="btn btn-ghost" href="projects.html" data-i18n="err.cta_projects">Ver projetos</a>
                <button class="btn btn-ghost" id="err-game" type="button" data-i18n="err.cta_game">Enquanto o on-call não responde… 🐦</button>
            </div>
        </div>
    </main>

    <!-- Easter egg containers -->
    <div id="cmdk-root" aria-hidden="true"></div>
    <div id="offduty-root" aria-hidden="true"></div>
    <div id="color-root" aria-hidden="true"></div>
    <div id="game-root" aria-hidden="true"></div>
    <div id="achievements-root" aria-hidden="true"></div>

    <script src="js/version.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
    <script src="js/easter-eggs.js"></script>
    <script src="js/achievements.js"></script>
    <script>
    (function () {
        'use strict';
        const log = document.getElementById('err-log');
        if (!log) return;

        const path = location.pathname || '/desconhecido';
        const now = new Date().toISOString().replace('T', ' ').slice(0, 19);
        const lines = [
            ['sql-meta', '[' + now + '] [scheduler] DAG site_router: run iniciado'],
            ['log-ok',   '[task resolve_route] lookup ' + path],
            ['log-err',  '[task resolve_route] ERROR: SELECT page FROM site WHERE route = \'' + path + '\' → matched 0 rows'],
            ['log-warn', '[task resolve_route] retry 1/3 … 2/3 … 3/3 — retries exhausted'],
            ['log-err',  'PageNotFoundError: nada agendado nesta rota'],
            ['sql-meta', '[scheduler] state=FAILED · duration=12ms · on-call notificado (ele está tomando café)']
        ];

        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        function append(i) {
            if (i >= lines.length) return;
            const span = document.createElement('span');
            span.className = 'log-line ' + lines[i][0];
            span.textContent = lines[i][1];
            log.appendChild(span);
            if (reduced) append(i + 1);
            else setTimeout(function () { append(i + 1); }, 140);
        }
        append(0);

        const gameBtn = document.getElementById('err-game');
        if (gameBtn) {
            gameBtn.addEventListener('click', function () {
                if (window.__games && window.__games.flappy) window.__games.flappy();
            });
        }
    })();
    </script>
</body>
</html>
